<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">02 · MySQL 서버는 두 계층으로 나뉜다</title><desc id="desc">MySQL 엔진이 연결 관리, SQL 해석, 옵티마이저, 실행 엔진을 거쳐 실행 방법을 정하고, 스토리지 엔진이 버퍼 풀과 데이터 파일에서 실제 데이터를 읽고 쓴다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#172b4d}.code{font-family:Menlo,"Apple SD Gothic Neo",monospace}</style>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="32" y="45" font-size="28">02 · MySQL 서버는 두 계층으로 나뉜다</text>
<text x="32" y="79" font-size="18">MySQL 엔진이 무엇을 어떤 순서로 읽을지 정하고, 스토리지 엔진이 실제 데이터를 읽고 쓴다.</text>
<rect x="40" y="200" width="170" height="110" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="58" y="240" font-size="21">앱</text>
<text x="58" y="274" font-size="18">커넥션 풀에서</text>
<text x="58" y="298" font-size="18">연결을 빌림</text>
<path d="M210 255 H306" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="222" y="242" font-size="17">SQL</text>
<rect x="280" y="115" width="880" height="270" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
<text x="304" y="152" font-size="22">MySQL 엔진 · 모든 스토리지 엔진에 공통</text>
<rect x="308" y="190" width="190" height="130" rx="10" fill="#e8f4ef" stroke="#94a3b8"/>
<text x="326" y="232" font-size="21">연결 관리</text>
<text x="326" y="266" font-size="18">인증 후 연결마다</text>
<text x="326" y="292" font-size="18">스레드 하나 배정</text>
<rect x="524" y="190" width="190" height="130" rx="10" fill="#e8f4ef" stroke="#94a3b8"/>
<text x="542" y="232" font-size="21">SQL 해석</text>
<text x="542" y="266" font-size="18">문법 검사,</text>
<text x="542" y="292" font-size="18">테이블·권한 확인</text>
<rect x="740" y="190" width="190" height="130" rx="10" fill="#e8f4ef" stroke="#94a3b8"/>
<text x="758" y="232" font-size="21">옵티마이저</text>
<text x="758" y="266" font-size="18">비용이 가장 적은</text>
<text x="758" y="292" font-size="18">실행 계획 선택</text>
<rect x="956" y="190" width="190" height="130" rx="10" fill="#e8f4ef" stroke="#94a3b8"/>
<text x="974" y="232" font-size="21">실행 엔진</text>
<text x="974" y="266" font-size="18">계획대로 요청,</text>
<text x="974" y="292" font-size="18">조인·정렬·집계</text>
<path d="M498 255 H520" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M714 255 H736" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M930 255 H952" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1051 320 V476" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1031 476 V320" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="700" y="420" font-size="19">한 행씩 읽기·쓰기 요청과 결과 행</text>
<text x="700" y="448" font-size="17"><tspan class="code">Handler_read_*</tspan> 값으로 요청 횟수 확인</text>
<rect x="280" y="480" width="880" height="170" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
<text x="304" y="517" font-size="22">스토리지 엔진 · 테이블마다 지정, 기본값 InnoDB</text>
<rect x="308" y="538" width="390" height="92" rx="10" fill="#e8f4ef" stroke="#94a3b8"/>
<text x="326" y="574" font-size="21">버퍼 풀 (메모리)</text>
<text x="326" y="608" font-size="18">자주 읽는 데이터 페이지를 보관</text>
<rect x="756" y="538" width="390" height="92" rx="10" fill="#fff1df" stroke="#94a3b8"/>
<text x="774" y="574" font-size="21">데이터 파일 (디스크)</text>
<text x="774" y="608" font-size="18">버퍼 풀에 없을 때 읽어 옴</text>
<path d="M756 584 H702" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="32" y="700" font-size="16">화살표 = 요청과 데이터의 흐름 · 단계는 단순화한 것이며, InnoDB 내부는 13강, 쿼리 한 건의 흐름은 15강에서 다룬다.</text>
</svg>
