<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">04 · 테이블스페이스에서 행까지</title><desc id="desc">테이블스페이스는 세그먼트로, 세그먼트는 1MB 익스텐트로, 익스텐트는 16KB 페이지 64개로 이뤄지고, 페이지 안에 여러 행이 들어간다. 긴 컬럼 값은 오버플로 페이지에 따로 저장된다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#172b4d}.code{font-family:Menlo,"Apple SD Gothic Neo",monospace}.muted{fill:#64748b}</style>
<rect width="1200" height="660" fill="#ffffff"/>
<text x="32" y="45" font-size="28">04 · 테이블스페이스에서 행까지</text>
<text x="32" y="79" font-size="18">큰 단위부터 확대해 보면 테이블스페이스, 세그먼트, 익스텐트, 페이지, 행 순서로 들어 있다.</text>
<rect x="40" y="110" width="250" height="440" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
<text x="60" y="146" font-size="21">테이블스페이스</text>
<text x="60" y="174" font-size="18" class="code">orders.ibd</text>
<rect x="60" y="196" width="210" height="96" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="76" y="226" font-size="18">세그먼트</text>
<text x="76" y="252" font-size="16" class="muted">인덱스의 리프 페이지</text>
<rect x="76" y="262" width="54" height="18" rx="3" fill="#ffffff" stroke="#94a3b8"/>
<rect x="136" y="262" width="54" height="18" rx="3" fill="#ffffff" stroke="#94a3b8"/>
<rect x="196" y="262" width="54" height="18" rx="3" fill="#e8f4ef" stroke="#334155" stroke-width="2"/>
<rect x="60" y="306" width="210" height="96" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="76" y="336" font-size="18">세그먼트</text>
<text x="76" y="362" font-size="16" class="muted">인덱스의 리프 아닌 페이지</text>
<rect x="76" y="372" width="54" height="18" rx="3" fill="#ffffff" stroke="#94a3b8"/>
<text x="60" y="440" font-size="17">인덱스마다 세그먼트</text>
<text x="60" y="466" font-size="17">두 개를 쓰고, 공간은</text>
<text x="60" y="492" font-size="17">익스텐트 단위로 받는다</text>
<text x="60" y="532" font-size="16" class="muted">작은 칸 = 익스텐트</text>
<rect x="330" y="110" width="250" height="440" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
