<text x="654" y="377" font-size="16" class="muted">남겨 둔 빈 공간</text>
<text x="640" y="430" font-size="17">읽기·쓰기의 최소 단위</text>
<text x="640" y="456" font-size="17">행 하나가 필요해도</text>
