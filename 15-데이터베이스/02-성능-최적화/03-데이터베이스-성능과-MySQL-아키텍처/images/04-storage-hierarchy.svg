<text x="40" y="596" font-size="20">진하게 표시한 칸을 다음 칸에서 확대했다.</text>
<text x="32" y="640" font-size="16">크기는 기본 설정(innodb_page_size = 16KB) 기준 · 행과 컬럼 값은 설명용 예시다.</text>
