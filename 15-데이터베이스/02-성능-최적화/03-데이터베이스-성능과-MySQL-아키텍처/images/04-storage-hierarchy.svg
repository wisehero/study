<text x="930" y="490" font-size="17">긴 값은 다른 페이지에</text>
<text x="930" y="516" font-size="17">두고 위치만 기록한다</text>
<path d="M250 271 C300 271 300 271 326 271" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M554 259 C585 259 590 223 616 223" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M850 223 C870 223 880 183 926 183" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
