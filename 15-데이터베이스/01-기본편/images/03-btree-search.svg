<text x="40" y="738" font-size="22">시작 위치는 몇 단계 만에 찾고, 그 뒤는 리프를 옆으로 읽기만 한다.</text>
<text x="32" y="780" font-size="16">초록 = 이번 탐색이 지나는 노드 · 회색 선 = 다른 자식 · 리프 항목은 (price, 기본키) · 실제 노드에는 키가 수백 개 들어간다.</text>
