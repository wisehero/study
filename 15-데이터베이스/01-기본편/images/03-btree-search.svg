<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">03 · B-Tree 인덱스로 price = 3000 찾기</title><desc id="desc">루트에서 3000이 들어갈 구간을 고르고, 브랜치에서 리프를 고른 뒤, 리프에서 price가 3000인 항목을 옆 리프까지 이어 읽고, 각 항목의 기본키로 실제 행을 찾는다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#172b4d}.code{font-family:Menlo,"Apple SD Gothic Neo",monospace}.muted{fill:#64748b}</style>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="32" y="45" font-size="28">03 · B-Tree 인덱스로 price = 3000 찾기</text>
<text x="32" y="79" font-size="18">위에서 아래로 내려가 시작 위치를 찾고, 리프는 옆으로 이어 읽는다.</text>
<text x="40" y="152" font-size="21">① 루트</text>
<text x="40" y="178" font-size="17" class="muted">구간 고르기</text>
<text x="40" y="282" font-size="21">② 브랜치</text>
<text x="40" y="308" font-size="17" class="muted">리프 고르기</text>
<text x="40" y="430" font-size="21">③ 리프</text>
<text x="40" y="456" font-size="17" class="muted">(price, PK) 정렬</text>
<text x="40" y="606" font-size="21">④ 테이블</text>
<text x="40" y="632" font-size="17" class="muted">PK로 행 찾기</text>
