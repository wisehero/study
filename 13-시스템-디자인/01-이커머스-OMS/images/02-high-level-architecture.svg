<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">02 · 이커머스 OMS 상위 설계</title><desc id="desc">채널 웹훅, 채널 폴링, WMS 이벤트가 인박스에 저장되고, 주문 키로 묶인 메시지 큐를 거쳐 주문 처리 컨슈머가 OMS DB에 한 트랜잭션으로 기록한다. 아웃박스 작업자는 WMS와 채널에 명령을 보내고, 재고 전송 작업자는 바뀐 판매 가능 수량을 병합해 속도 제한기를 거쳐 채널 4곳에 보낸다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#172b4d}.code{font-family:Menlo,"Apple SD Gothic Neo",monospace}.muted{fill:#64748b}</style>
<rect width="1200" height="740" fill="#ffffff"/>
<text x="32" y="45" font-size="28">02 · 이커머스 OMS 상위 설계</text>
<text x="32" y="79" font-size="18">들어오는 것은 모두 인박스로, 나가는 것은 모두 DB에 먼저 기록한 뒤 별도 작업자가 보낸다.</text>

<text x="40" y="132" font-size="22">들어오는 경로</text>
<rect x="40" y="150" width="190" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="56" y="178" font-size="19">채널 웹훅</text>
<text x="56" y="202" font-size="16" class="muted">빠른 경로</text>
<rect x="40" y="234" width="190" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="56" y="262" font-size="19">채널 폴링</text>
<text x="56" y="286" font-size="16" class="muted">5분 주기 · 겹침 10분</text>
<rect x="40" y="318" width="190" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="56" y="346" font-size="19">WMS 이벤트</text>
<text x="56" y="370" font-size="16" class="muted">출고 완료 · 재고 변경</text>

<rect x="290" y="150" width="200" height="232" rx="10" fill="#e8f4ef" stroke="#94a3b8"/>
<text x="306" y="184" font-size="19">인박스</text>
<text x="306" y="216" font-size="16">서명 검증 후 저장</text>
<text x="306" y="240" font-size="16">바로 성공 응답</text>
<text x="306" y="272" font-size="16">채널 원본 이력을 겸함</text>
<text x="306" y="296" font-size="16" class="muted">append-only</text>

<rect x="550" y="150" width="200" height="232" rx="10" fill="#e8f4ef" stroke="#94a3b8"/>
<text x="566" y="184" font-size="19">메시지 큐</text>
<text x="566" y="216" font-size="16">Kafka 또는 SQS FIFO</text>
<text x="566" y="248" font-size="16">키: 채널 · 스토어 ·</text>
<text x="566" y="272" font-size="16">채널 주문번호</text>
<text x="566" y="304" font-size="16">같은 주문은</text>
<text x="566" y="328" font-size="16">한 번에 하나씩</text>

<rect x="810" y="150" width="170" height="232" rx="10" fill="#e8f4ef" stroke="#94a3b8"/>
<text x="826" y="184" font-size="19">주문 처리 컨슈머</text>
<text x="826" y="216" font-size="16">처리한 메시지 건너뜀</text>
<text x="826" y="240" font-size="16">조건부 갱신</text>
<text x="826" y="264" font-size="16">상태 전이 가드</text>
<text x="826" y="296" font-size="16">재고 할당:</text>
<text x="826" y="320" font-size="16" class="code">조건부 UPDATE</text>

<rect x="1010" y="150" width="160" height="232" rx="10" fill="#fff1df" stroke="#94a3b8"/>
<text x="1026" y="184" font-size="19">OMS DB</text>
<text x="1026" y="216" font-size="16">주문 · 라인 상태</text>
<text x="1026" y="240" font-size="16">재고 사본 · 할당</text>
<text x="1026" y="264" font-size="16">아웃박스</text>
<text x="1026" y="288" font-size="16">재고 전송 목록</text>
<text x="1026" y="340" font-size="14" class="muted">모두 한 트랜잭션에서</text>
<text x="1026" y="360" font-size="14" class="muted">함께 기록</text>

<path d="M230 182 H286" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M230 266 H286" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M230 350 H286" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M490 266 H546" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M750 266 H806" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M980 266 H1006" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

<text x="40" y="472" font-size="22">나가는 경로</text>
<path d="M1060 382 V440 H450 V640 H546" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M450 532 H546" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="462" y="432" font-size="14" class="muted">DB에 기록된 것을 읽어 보낸다</text>

<rect x="550" y="484" width="200" height="96" rx="10" fill="#e8f4ef" stroke="#94a3b8"/>
<text x="566" y="516" font-size="19">아웃박스 작업자</text>
<text x="566" y="544" font-size="16">실패 시 재시도</text>
<text x="566" y="568" font-size="16">결과 모르면 조회 먼저</text>
<rect x="810" y="484" width="360" height="96" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="826" y="516" font-size="19">WMS · 채널</text>
<text x="826" y="544" font-size="16">WMS: 출고 지시 · 출고 중지 (출고 지시 ID)</text>
<text x="826" y="568" font-size="16">채널: 송장 등록 · 환불 요청</text>
<path d="M750 532 H806" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="550" y="600" width="200" height="80" rx="10" fill="#e8f4ef" stroke="#94a3b8"/>
<text x="566" y="632" font-size="19">재고 전송 작업자</text>
<text x="566" y="660" font-size="16">병합 + 적응형 주기</text>
<rect x="810" y="600" width="170" height="80" rx="10" fill="#e8f4ef" stroke="#94a3b8"/>
<text x="826" y="632" font-size="19">속도 제한기</text>
<text x="826" y="660" font-size="16">채널별 호출 한도</text>
<rect x="1010" y="600" width="160" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="1026" y="632" font-size="19">채널 4곳</text>
<text x="1026" y="660" font-size="16">판매 가능 수량</text>
<path d="M750 640 H806" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M980 640 H1006" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

<text x="32" y="716" font-size="16">회색 = 외부 시스템 · 초록 = OMS 구성 요소 · 주황 = 저장소 · WMS와 채널의 결과는 다시 웹훅·이벤트로 인박스에 들어온다.</text>
</svg>
