name: commerce-study
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: commerce_study
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study_local
    ports:
      - "127.0.0.1:${STUDY_DB_PORT:-15432}:5432"
    volumes:
      - study_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d commerce_study"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  study_postgres:
