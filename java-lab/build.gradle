plugins {
    id 'application'
}

group = 'dev.study'
version = '0.0.1-SNAPSHOT'
description = 'Pure Java learning exercises'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'dev.study.javalab.collections.CollectionExample'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('runEffectiveJava', JavaExec) {
    group = 'application'
    description = 'Run Effective Java learning chapters 01 and 02'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.study.javalab.effectiveJava.EffectiveJavaExample'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
