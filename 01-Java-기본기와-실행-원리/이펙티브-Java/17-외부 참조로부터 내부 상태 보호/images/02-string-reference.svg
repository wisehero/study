<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">02 · String은 불변이지만 name 필드는 바뀔 수 있다</title><desc id="desc">setName은 문자열 내용을 수정하지 않고, Product.name에 다른 String의 참조를 대입한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#172b4d}.code{font-family:Menlo,"Apple SD Gothic Neo",monospace}</style>
<rect width="1200" height="510" fill="#ffffff"/>
<text x="32" y="45" font-size="28" class="">02 · String은 불변이지만 name 필드는 바뀔 수 있다</text>
<text x="32" y="79" font-size="18" class="">setName은 문자열 내용을 수정하지 않고, Product.name에 다른 String의 참조를 대입한다.</text>
<text x="40" y="133" font-size="22" class="code">product.setName(&quot;로션&quot;) → this.name = name;</text>
<rect x="40" y="185" width="340" height="113" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="58" y="217" font-size="21" class="">같은 Product P1</text>
<text x="58" y="250" font-size="19" class="">name 필드: 참조를 보관</text>
<text x="58" y="278" font-size="19" class="">setter로 참조 재할당 가능</text>
<rect x="805" y="170" width="330" height="85" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="823" y="202" font-size="21" class="">기존 String S1</text>
<text x="823" y="235" font-size="19" class="">&quot;선크림&quot; · 내용은 그대로</text>
<rect x="805" y="330" width="330" height="85" rx="10" fill="#fff1df" stroke="#94a3b8"/>
<text x="823" y="362" font-size="21" class="">다른 String S2</text>
<text x="823" y="395" font-size="19" class="">&quot;로션&quot; · 내용은 그대로</text>
<path d="M380 241 H805" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="464" y="222" font-size="18" class="">이전 참조 (교체됨)</text>
<path d="M380 283 H600 V374 H805" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="620" y="353" font-size="18" class="">변경 후 참조</text>
<text x="40" y="449" font-size="21" class="">불변인 것은 String 객체다. Product의 name 필드까지 불변이 되는 것은 아니다.</text>
<text x="32" y="490" font-size="16" class="">화살표 = 참조 · L = 목록 · P = Product · S = String · 번호는 설명용 식별자이며 실제 주소가 아니다.</text>
</svg>
