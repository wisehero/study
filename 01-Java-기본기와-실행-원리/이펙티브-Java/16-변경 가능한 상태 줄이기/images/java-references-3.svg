<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 555" role="img" aria-label="원소도 복사: Tag까지 분리"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{fill:#252525;font-family:Arial,"Apple SD Gothic Neo",sans-serif}.mono{font-family:ui-monospace,monospace}</style><rect width="1200" height="555" fill="white"/><text x="25" y="34" font-size="26" class="">원소도 복사: Tag까지 분리</text><text x="25" y="69" font-size="18" class="mono">this.tags = tags.stream().map(t -&gt; new Tag(t.name)).toList();</text><text x="30" y="115" font-size="17" class="">참조를 가진 변수 / 필드</text><text x="470" y="115" font-size="17" class="">목록 객체 · 칸에는 원소의 참조</text><text x="940" y="115" font-size="17" class="">원소 객체</text><path d="M 32 146 L 300 144 L 299 245 L 29 246 Z" fill="white" stroke="#242424" stroke-width="2" stroke-linejoin="round"/><text x="48" y="176" font-size="20" class="">호출자의 tags</text><path d="M 30 189 L 300 190" stroke="#242424" stroke-width="1.3"/><text x="48" y="219" font-size="18" class="">L1을 가리키는 참조</text><path d="M 32 341 L 300 339 L 299 452 L 29 453 Z" fill="white" stroke="#242424" stroke-width="2" stroke-linejoin="round"/><text x="48" y="371" font-size="20" class="">Product 객체</text><path d="M 30 384 L 300 385" stroke="#242424" stroke-width="1.3"/><text x="48" y="414" font-size="18" class="">private final tags</text><text x="48" y="439" font-size="18" class="">목록을 가리키는 필드</text><path d="M 472 146 L 750 144 L 749 262 L 469 263 Z" fill="white" stroke="#242424" stroke-width="2" stroke-linejoin="round"/><text x="488" y="176" font-size="20" class="">ArrayList  L1</text><path d="M 470 189 L 750 190" stroke="#242424" stroke-width="1.3"/><text x="488" y="219" font-size="18" class="">[0] → T1</text><text x="488" y="244" font-size="18" class="">추가·삭제·교체 가능</text><path d="M 472 341 L 750 339 L 749 457 L 469 458 Z" fill="white" stroke="#242424" stroke-width="2" stroke-linejoin="round"/><text x="488" y="371" font-size="20" class="">수정 불가능한 목록  L2</text><path d="M 470 384 L 750 385" stroke="#242424" stroke-width="1.3"/><text x="488" y="414" font-size="18" class="">[0] → T2</text><text x="488" y="439" font-size="18" class="">추가·삭제·교체 불가</text><path d="M 300 198 L 470 198" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 300 398 L 470 398" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 942 146 L 1170 144 L 1169 262 L 939 263 Z" fill="white" stroke="#242424" stroke-width="2" stroke-linejoin="round"/><text x="958" y="176" font-size="20" class="">Tag  T1</text><path d="M 940 189 L 1170 190" stroke="#242424" stroke-width="1.3"/><text x="958" y="219" font-size="18" class="">name = &quot;신상품&quot;</text><text x="958" y="244" font-size="18" class="">외부 원소</text><path d="M 942 341 L 1170 339 L 1169 457 L 939 458 Z" fill="white" stroke="#242424" stroke-width="2" stroke-linejoin="round"/><text x="958" y="371" font-size="20" class="">Tag  T2</text><path d="M 940 384 L 1170 385" stroke="#242424" stroke-width="1.3"/><text x="958" y="414" font-size="18" class="">name = &quot;신상품&quot;</text><text x="958" y="439" font-size="18" class="">복사한 내부 원소</text><path d="M 750 215 L 940 215" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 750 410 L 940 410" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="25" y="503" font-size="18" class="">T1과 T2가 분리된다. 단, 가변 T2를 getter로 노출하면 다시 변경될 수 있다.</text><text x="25" y="534" font-size="15" class="">L1·L2·T1·T2는 설명용 식별자다. 화살표는 참조이며 실제 메모리 주소·배치는 생략한다.</text></svg>