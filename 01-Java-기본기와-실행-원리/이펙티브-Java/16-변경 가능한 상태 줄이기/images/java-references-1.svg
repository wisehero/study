<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 555" role="img" aria-label="대입: 목록까지 공유"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#333" stroke-width="1.4"/></marker></defs><style>text{fill:#252525;font-family:Arial,"Apple SD Gothic Neo",sans-serif}.mono{font-family:ui-monospace,monospace}</style><rect width="1200" height="555" fill="white"/><text x="25" y="34" font-size="26" class="">대입: 목록까지 공유</text><text x="25" y="69" font-size="18" class="mono">this.tags = tags;</text><text x="30" y="115" font-size="17" class="">참조를 가진 변수 / 필드</text><text x="470" y="115" font-size="17" class="">목록 객체 · 칸에는 원소의 참조</text><text x="940" y="115" font-size="17" class="">원소 객체</text><path d="M 32 146 L 300 144 L 299 245 L 29 246 Z" fill="white" stroke="#242424" stroke-width="2" stroke-linejoin="round"/><text x="48" y="176" font-size="20" class="">호출자의 tags</text><path d="M 30 189 L 300 190" stroke="#242424" stroke-width="1.3"/><text x="48" y="219" font-size="18" class="">L1을 가리키는 참조</text><path d="M 32 341 L 300 339 L 299 452 L 29 453 Z" fill="white" stroke="#242424" stroke-width="2" stroke-linejoin="round"/><text x="48" y="371" font-size="20" class="">Product 객체</text><path d="M 30 384 L 300 385" stroke="#242424" stroke-width="1.3"/><text x="48" y="414" font-size="18" class="">private final tags</text><text x="48" y="439" font-size="18" class="">목록을 가리키는 필드</text><path d="M 472 238 L 750 236 L 749 354 L 469 355 Z" fill="white" stroke="#242424" stroke-width="2" stroke-linejoin="round"/><text x="488" y="268" font-size="20" class="">ArrayList  L1</text><path d="M 470 281 L 750 282" stroke="#242424" stroke-width="1.3"/><text x="488" y="311" font-size="18" class="">[0] → T1</text><text x="488" y="336" font-size="18" class="">추가·삭제·교체 가능</text><path d="M 300 198 L 380 198 L 380 272 L 470 272" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 300 398 L 405 398 L 405 320 L 470 320" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 942 238 L 1170 236 L 1169 354 L 939 355 Z" fill="white" stroke="#242424" stroke-width="2" stroke-linejoin="round"/><text x="958" y="268" font-size="20" class="">Tag  T1</text><path d="M 940 281 L 1170 282" stroke="#242424" stroke-width="1.3"/><text x="958" y="311" font-size="18" class="">name = &quot;신상품&quot;</text><text x="958" y="336" font-size="18" class="">변경 가능한 객체</text><path d="M 750 295 L 940 295" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="25" y="503" font-size="18" class="">두 참조가 목록 L1 하나를 가리킨다. final은 Product.tags의 재할당만 막는다.</text><text x="25" y="534" font-size="15" class="">L1·L2·T1·T2는 설명용 식별자다. 화살표는 참조이며 실제 메모리 주소·배치는 생략한다.</text></svg>